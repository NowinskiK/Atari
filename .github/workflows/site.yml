# Publishes the page (the Atari games catalog playable in the browser) to GitHub Pages on every push to main.
# The repository root is the site: index.html, player.js, style.css, firmware/ and games/ (catalog and game files).
# See README.md.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'player.js'
      - 'style.css'
      - 'games/**'
      - 'firmware/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # games with a url: in games/<name>.yml are not in the repository: fetch them into games/files/<file>
      # (the other site sends no CORS header, so the page cannot load them from there itself)
      - name: Download games from other sites
        run: |
          # the games listed in catalog.yml (catalog.yml itself is a list, not a game)
          for name in $(yq '.[]' games/catalog.yml); do
            f="games/$name.yml"
            url=$(yq '.url // ""' "$f")
            [ -n "$url" ] || continue
            file=$(yq '.file' "$f")
            echo "$f: $url -> games/files/$file"
            curl -fsSL --retry 3 -o "games/files/$file" "$url"
          done

      # .git, .github and other dotfiles (.gitignore, .vscode) are left out by the action
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
