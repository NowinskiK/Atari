<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog · Atari Games</title>
<meta name="description" content="What changed in the Atari Games site, player and catalog.">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
	<a id="back" href="../">← Catalog</a>
	<article class="changelog"></article>
</main>
<script type="module">
// the page is CHANGELOG.md from the repository, rendered here (Markdown: marked, as for the games' About text)
import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/+esm";

const page = document.querySelector(".changelog");
try {
	const r = await fetch("../CHANGELOG.md", { cache: "no-cache" });
	if (!r.ok) throw new Error(`CHANGELOG.md: HTTP ${r.status}`);
	page.innerHTML = marked.parse(await r.text());
} catch (err) {
	page.textContent = `Error: ${err.message}`;
}
</script>
</body>
</html>
