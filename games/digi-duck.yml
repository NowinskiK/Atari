title: Digi Duck
file: digi-duck.xex                 # disk image (.atr) or executable (.xex) in games/files/
info: LK Avalon, 1993 · by Dariusz Żołna · executable (XEX)
basic: false                         # false = OPTION is held at power-on, BASIC off (the game reboots if BASIC is on)
controls:
  arrows: joystick                   # keys = Atari cursor keys (Ctrl + arrows), joystick = joystick directions
  fire: [Space, ControlLeft]         # more PC keys for the joystick button (right Ctrl and numpad 0 always are)
