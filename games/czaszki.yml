title: Czaszki
file: czaszki.xex                    # disk image (.atr) or executable (.xex) in games/files/
info: Tecumseh Software / LK Avalon, 1993 · by Paweł and Marek Grotowski · Polish · executable (XEX)
description: A logic game – go from room to room and bring peace to the souls of the Indians, saving the world from their revenge.
basic: false                         # false = OPTION is held at power-on, BASIC off (the game loads up to $BBDF)
controls:
  arrows: joystick                   # keys = Atari cursor keys (Ctrl + arrows), joystick = joystick directions
  fire: [Space, ControlLeft]         # more PC keys for the joystick button (right Ctrl and numpad 0 always are)
