title: Zeus
file: zeus.xex                       # disk image (.atr) or executable (.xex) in games/files/
info: LK Avalon, 1993 · by Krzysztof Szmatola · Polish · executable (XEX)
description: As the Greek god Zeus, rescue Aphrodite from the evil Bat through eight levels – jump and throw thunderbolts.
basic: false                         # false = OPTION is held at power-on, BASIC off (the game loads up to $BFFF)
controls:
  arrows: joystick                   # keys = Atari cursor keys (Ctrl + arrows), joystick = joystick directions
  fire: [Space, ControlLeft]         # more PC keys for the joystick button (right Ctrl and numpad 0 always are)
